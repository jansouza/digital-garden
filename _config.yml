title: "Garden"
description: "Um digital garden com notas, tutoriais e documentação"
url: "https://garden.jansouza.com"
baseurl: ""
lang: "pt-BR"

# Google Analytics 4 Measurement ID (formato G-XXXXXXXXXX)
# Crie a propriedade em https://analytics.google.com e substitua abaixo
google_analytics: "G-0LYVB8R8BC"

logo: /assets/images/social/og-image.png

twitter:
  card: summary_large_image

social:
  name: Jan Souza
  links:
    - https://github.com/jansouza
    - https://www.linkedin.com/in/jansouza

remote_theme: pages-themes/architect@v0.2.0

plugins:
  - jekyll-remote-theme
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

collections:
  tutorials:
    output: true
    permalink: /tutorials/:path/
  docs:
    output: true
    permalink: /docs/:path/

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
  - scope:
      path: ""
      type: "tutorials"
    values:
      layout: "doc"
  - scope:
      path: ""
      type: "docs"
    values:
      layout: "doc"

# Arquivos/pastas excluídos do build
exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - README.md
