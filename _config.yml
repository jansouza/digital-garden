# "title" vai no <title> de todas as páginas e no Google;
# "short_title" é o nome exibido no cabeçalho do site.
title: "Jan Souza · Digital Garden"
short_title: "Garden"
tagline: "SRE, IA generativa, homelab e impressão 3D"
description: "Um digital garden sobre SRE, observabilidade, IA generativa, homelab e impressão 3D"
url: "https://garden.jansouza.com"
baseurl: ""
lang: "pt-BR"

author:
  name: Jan Souza
  url: https://garden.jansouza.com/about/

# Google Analytics 4 Measurement ID (formato G-XXXXXXXXXX)
# Crie a propriedade em https://analytics.google.com e substitua abaixo
google_analytics: "G-0LYVB8R8BC"

logo: /assets/images/social/og-image.png

social:
  name: Jan Souza
  links:
    - https://jansouza.com
    - https://github.com/jansouza
    - https://www.linkedin.com/in/jansouza

remote_theme: pages-themes/architect@v0.2.0

plugins:
  - jekyll-remote-theme
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

collections:
  tutorials:
    output: true
    permalink: /tutorials/:path/
  docs:
    output: true
    permalink: /docs/:path/

defaults:
  - scope:
      path: ""
    values:
      image: /assets/images/social/og-image.png
      # Toda nota tem lang explícito, para as listas filtrarem com where.
      lang: "pt-BR"
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
  - scope:
      path: ""
      type: "tutorials"
    values:
      layout: "doc"
  - scope:
      path: ""
      type: "docs"
    values:
      layout: "doc"
  # Versões em inglês: _posts/en/, _tutorials/en/, _docs/en/ e as páginas em en/.
  - scope:
      path: "en"
    values:
      lang: "en"
  - scope:
      path: "_posts/en"
      type: "posts"
    values:
      lang: "en"
      permalink: /en/:categories/:year/:month/:day/:title:output_ext
  - scope:
      path: "_tutorials/en"
      type: "tutorials"
    values:
      lang: "en"
      permalink: /en/tutorials/:name/
  - scope:
      path: "_docs/en"
      type: "docs"
    values:
      lang: "en"
      permalink: /en/docs/:name/

# Arquivos/pastas excluídos do build
exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - README.md
  - AGENTS.md
  - docs/plans
